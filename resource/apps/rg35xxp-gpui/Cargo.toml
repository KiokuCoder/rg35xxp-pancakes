[package]
name = "rg35xxp-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { path = "../../../zed/crates/gpui", default-features = false }
gpui_platform = { path = "../../../zed/crates/gpui_platform", features = ["fbdev"] }
env_logger = "0.11"
log = "0.4"

# Same patches as the zed workspace, limited to crates gpui actually pulls in.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }
